<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Exported Successfully - ComicCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: url('/static/images/background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 1;
        }

        .success-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            padding: 45px 35px;
            text-align: center;
        }

        .icon-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-download {
            background: #16a34a;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
        }

        .btn-download:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        .btn-home {
            background: #1a73e8;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
        }

        .btn-home:hover {
            background: #1557b0;
            transform: translateY(-2px);
        }

        .pdf-info {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">&#10004;</div>
        <h1>Comic Exported Successfully!</h1>
        <p>Your AI-powered comic has been successfully created! Dive back in and bring another story to life.</p>

        <div class="actions-group">
            <a href="/download?path={{ pdf_path }}" class="btn btn-download" id="downloadBtn">
                &#128190; Download Comic PDF
            </a>
            <a href="/" class="btn btn-home">
                &#10024; Go Create Another Comic
            </a>
        </div>

        <div class="pdf-info">
            File location: <code>{{ pdf_path }}</code>
        </div>
    </div>

    <!-- Automatically trigger the PDF download after page loads -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const downloadLink = document.getElementById('downloadBtn');
            if (downloadLink) {
                setTimeout(() => {
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = downloadLink.href;
                    document.body.appendChild(iframe);
                }, 600);
            }
        });
    </script>
</body>
</html>
